name: Build

# Optional: releases are normally cut locally with scripts/release.sh, which
# needs no GitHub Actions. This workflow is here for anyone who wants CI builds
# and can be started by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Bundle MacClean.app
        run: scripts/bundle.sh

      - name: Zip app
        run: ditto -c -k --keepParent build/MacClean.app build/MacClean.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MacClean
          path: build/MacClean.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/MacClean.zip

  cask:
    # After a tagged release, pin the Homebrew cask to the new zip.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          name: MacClean
          path: dist

      - name: Update cask
        run: scripts/update_cask.sh "${GITHUB_REF_NAME#v}" dist/MacClean.zip

      - name: Commit cask
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/macclean.rb
          git commit -m "Update Homebrew cask to ${GITHUB_REF_NAME}" || exit 0
          git push
